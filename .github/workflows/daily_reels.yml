name: Daily DCInside Reels Script Generator

on:
  schedule:
    # KST 23:59 = UTC 14:59 (한국시간 매일 밤 11시 59분)
    - cron: '59 14 * * *'
  workflow_dispatch:

permissions:
  contents: write # status.txt 파일 기입 및 push 권한 부여

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v3

    - name: 파이썬 3.10 설치
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 필요 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 google-generativeai

    - name: 대본 생성 및 텔레그램 전송 실행
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python app.py

    - name: 상태(status.txt) 저장소에 영구 기록
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add status.txt
        git commit -m "Automated bot status update [skip ci]" || echo "No status change to commit"
        git push
